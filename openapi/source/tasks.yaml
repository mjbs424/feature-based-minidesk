paths:
  /api/minidesk/v1/tasks:
    get:
      operationId: listTasks
      summary: List tasks
      parameters:
        - name: view
          in: query
          required: false
          schema:
            type: string
            enum:
              - today
              - upcoming
              - completed
              - all
            default: today
        - name: q
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 160
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque cursor for the same filters and current dataset.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    post:
      operationId: createTask
      summary: Create task
      parameters:
        - name: X-Minidesk-Dataset-Id
          in: header
          required: true
          schema:
            type: string
          description: Current datasetId from GET /api/minidesk/v1/demo.
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
          description: Optional retry key, scoped to this route and dataset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
          headers:
            Location:
              description: Created resource URL
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /api/minidesk/v1/tasks/summary:
    get:
      operationId: getTaskSummary
      summary: Get task counts
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /api/minidesk/v1/tasks/{taskId}:
    get:
      operationId: getTask
      summary: Get task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    patch:
      operationId: updateTask
      summary: Update task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
        - name: X-Minidesk-Dataset-Id
          in: header
          required: true
          schema:
            type: string
          description: Current datasetId from GET /api/minidesk/v1/demo.
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
          description: Quoted version, for example "1".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskPatch"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    delete:
      operationId: deleteTask
      summary: Delete task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
        - name: X-Minidesk-Dataset-Id
          in: header
          required: true
          schema:
            type: string
          description: Current datasetId from GET /api/minidesk/v1/demo.
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
          description: Quoted version, for example "1".
      responses:
        "204":
          description: Success
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
components:
  schemas:
    Task:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        title:
          type: string
        notes:
          anyOf:
            - type: string
            - type: "null"
        categoryId:
          type: string
        dueDate:
          anyOf:
            - type: string
              format: date
            - type: "null"
        startTime:
          anyOf:
            - type: string
              pattern: ^([01]\d|2[0-3]):[0-5]\d$
            - type: "null"
        endTime:
          anyOf:
            - type: string
              pattern: ^([01]\d|2[0-3]):[0-5]\d$
            - type: "null"
        isCompleted:
          type: boolean
        completedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        isFocusPriority:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
      required:
        - id
        - title
        - notes
        - categoryId
        - dueDate
        - startTime
        - endTime
        - isCompleted
        - completedAt
        - isFocusPriority
        - createdAt
        - updatedAt
        - version
    TaskInput:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        notes:
          anyOf:
            - type: string
              maxLength: 2000
            - type: "null"
        categoryId:
          type: string
        dueDate:
          anyOf:
            - type: string
              format: date
            - type: "null"
        startTime:
          anyOf:
            - type: string
            - type: "null"
        endTime:
          anyOf:
            - type: string
            - type: "null"
      required:
        - title
    TaskPatch:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        notes:
          anyOf:
            - type: string
              maxLength: 2000
            - type: "null"
        categoryId:
          type: string
        dueDate:
          anyOf:
            - type: string
              format: date
            - type: "null"
        startTime:
          anyOf:
            - type: string
            - type: "null"
        endTime:
          anyOf:
            - type: string
            - type: "null"
        isCompleted:
          type: boolean
        isFocusPriority:
          type: boolean
      required: []
    TaskList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        nextCursor:
          anyOf:
            - type: string
            - type: "null"
      required:
        - items
        - nextCursor
    TaskSummary:
      type: object
      additionalProperties: false
      properties:
        today:
          type: integer
        upcoming:
          type: integer
        completed:
          type: integer
        total:
          type: integer
      required:
        - today
        - upcoming
        - completed
        - total
