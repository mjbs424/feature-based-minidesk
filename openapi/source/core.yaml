openapi: 3.1.0
info:
  title: MiniDesk public demo API
  version: 1.0.0
  description:
    "Frontend-facing HTTP contract for the shared 12-hour UTC demo. All responses use Cache-Control:
    no-store. No authentication. Money is integer USD cents. State-changing requests require
    X-Minidesk-Dataset-Id. Error responses use {error:{code,message,fields?}}. This document describes
    observable behavior, not database internals."
servers:
  - url: /
    description: Same origin; an alternate origin may be supplied at the frontend transport boundary.
paths:
  /api/minidesk/v1/demo:
    get:
      operationId: getDemo
      summary: Get dataset generation and server clock
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Demo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /api/minidesk/v1/task-categories:
    get:
      operationId: listTaskCategories
      summary: List task categories
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    post:
      operationId: createTaskCategory
      summary: Create task category
      parameters:
        - name: X-Minidesk-Dataset-Id
          in: header
          required: true
          schema:
            type: string
          description: Current datasetId from GET /api/minidesk/v1/demo.
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
          description: Optional retry key, scoped to this route and dataset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
          headers:
            Location:
              description: Created resource URL
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /api/minidesk/v1/expense-categories:
    get:
      operationId: listExpenseCategories
      summary: List expense categories
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    post:
      operationId: createExpenseCategory
      summary: Create expense category
      parameters:
        - name: X-Minidesk-Dataset-Id
          in: header
          required: true
          schema:
            type: string
          description: Current datasetId from GET /api/minidesk/v1/demo.
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
          description: Optional retry key, scoped to this route and dataset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
          headers:
            Location:
              description: Created resource URL
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
components:
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict or dataset reset
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BodyTooLarge:
      description: Body too large
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnsupportedMediaType:
      description: Unsupported media type
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Rate limited
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    DatabaseUnavailable:
      description: Database unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
          required:
            - code
            - message
      required:
        - error
    Demo:
      type: object
      additionalProperties: false
      properties:
        datasetId:
          type: string
        timeZone:
          type: string
          const: UTC
        currency:
          type: string
          const: USD
        serverNow:
          type: string
          format: date-time
        resetAt:
          type: string
          format: date-time
      required:
        - datasetId
        - timeZone
        - currency
        - serverNow
        - resetAt
    Category:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        label:
          type: string
        isDefault:
          type: boolean
      required:
        - id
        - label
        - isDefault
    CategoryList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Category"
      required:
        - items
    CategoryInput:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 40
      required:
        - label
