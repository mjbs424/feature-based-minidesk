name: Deploy checked build

on:
  workflow_run:
    workflows: ["Check and package"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}
    concurrency:
      group: vercel-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/download-artifact@v8
        with:
          name: vercel-static-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: bundle
      - name: Mark preview pending
        if: github.event.workflow_run.event == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          PREVIEW_STATE: pending
        run: node .github/scripts/preview-status.mjs
      - name: Mark bundle size pending
        if: github.event.workflow_run.event == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: node .github/scripts/bundle-size.mjs pending
      - run: npm install --global --ignore-scripts vercel@65.16.0
        working-directory: ${{ runner.temp }}
      - name: Validate, deploy and update PR
        id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ github.event.workflow_run.event == 'push' && secrets.VERCEL_TOKEN || secrets.VERCEL_PREVIEW_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ github.event.workflow_run.event == 'push' && secrets.VERCEL_PROJECT_ID || secrets.VERCEL_PREVIEW_PROJECT_ID }}
          VERCEL_PREVIEW_PROJECT_ID: ${{ secrets.VERCEL_PREVIEW_PROJECT_ID }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: node .github/scripts/deploy.mjs
      - name: Report preview result
        if: always() && github.event.workflow_run.event == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          PREVIEW_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: node .github/scripts/preview-status.mjs
      - uses: pnpm/action-setup@v6
        if: steps.deploy.outcome == 'success' && github.event.workflow_run.event == 'pull_request'
        with:
          version: 12.21.0
          run_install: false
      - name: Install size checker
        if: steps.deploy.outcome == 'success' && github.event.workflow_run.event == 'pull_request'
        run: pnpm install --frozen-lockfile
      - name: Report per-file bundle sizes
        id: bundle_size
        if: steps.deploy.outcome == 'success' && github.event.workflow_run.event == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: node .github/scripts/bundle-size.mjs check
      - name: Report interrupted bundle size check
        if: always() && github.event.workflow_run.event == 'pull_request' && steps.bundle_size.outcome == 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: node .github/scripts/bundle-size.mjs failed
      - name: Mark Lighthouse pending
        if: always() && steps.deploy.outcome == 'success' && github.event.workflow_run.event == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: node .github/scripts/lighthouse-report.mjs pending

  lighthouse:
    needs: deploy
    if: always() && github.event.workflow_run.event == 'pull_request' && needs.deploy.outputs.preview_url != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install Lighthouse CI
        run: npm install --global --ignore-scripts @lhci/cli@0.16.0
      - name: Measure preview with Lighthouse
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.preview_url }}
        run: lhci collect --url="$PREVIEW_URL" --numberOfRuns=3 --settings.chromeFlags="--no-sandbox"
        timeout-minutes: 15
      - name: Save Lighthouse reports
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-preview-reports
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  lighthouse_report:
    needs: [deploy, lighthouse]
    if: always() && github.event.workflow_run.event == 'pull_request' && needs.deploy.outputs.preview_url != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/download-artifact@v8
        with:
          name: vercel-static-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: bundle
      - name: Download Lighthouse reports
        if: needs.lighthouse.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: lighthouse-preview-reports
          path: .lighthouseci
      - name: Report Lighthouse scores
        id: lighthouse_scores
        if: needs.lighthouse.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          PREVIEW_URL: ${{ needs.deploy.outputs.preview_url }}
        run: node .github/scripts/lighthouse-report.mjs check
      - name: Report interrupted Lighthouse check
        if: always() && steps.lighthouse_scores.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: node .github/scripts/lighthouse-report.mjs failed
