name: Check and package

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan commits for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
      - name: Remove local Gitleaks report
        if: always()
        run: rm -f results.sarif
      - uses: pnpm/action-setup@v6
        with:
          version: 12.21.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: node .github/scripts/security-audit.mjs
        timeout-minutes: 5
      - run: pnpm exec vp check
      - run: pnpm test
      - run: pnpm run audit
        timeout-minutes: 5
      - run: pnpm run doctor
        timeout-minutes: 5
      - run: pnpm run build
      - name: Package frontend and MiniDesk Function for Vercel
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node scripts/package-vercel.mjs
          cp .github/bundle-size.json bundle/bundle-size.json
          cp .github/lighthouse-thresholds.json bundle/lighthouse-thresholds.json
          node -e 'require("fs").writeFileSync("bundle/manifest.json", JSON.stringify({event:process.env.EVENT_NAME,pr:Number(process.env.PR_NUMBER)||null,sha:process.env.HEAD_SHA,runSha:process.env.RUN_SHA}))'
      - name: Check trusted main deploy compatibility
        run: node scripts/check-main-deploy-compatibility.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: vercel-static-build
          path: bundle/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
